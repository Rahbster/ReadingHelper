<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to get a Google AI API Key</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f9;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #1a73e8; margin-top: 0; }
        .step-content { min-height: 180px; margin-top: 20px; font-size: 1.1rem; }
        .nav-buttons { margin-top: 30px; display: flex; justify-content: space-between; }
        button {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        #prev-btn { background: #e0e0e0; color: #555; }
        #next-btn { background: #1a73e8; color: white; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .indicator { margin-top: 20px; color: #888; font-size: 0.9rem; }
        .action-button {
            display: inline-block;
            margin-top: 15px;
            background: #34a853;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
        }
        .step-warning {
            border: 2px solid #d93025;
            background-color: #fce8e6;
            padding: 20px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .warning-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Magic Illustrator Setup</h1>
        <div id="step-container" class="step-content"></div>
        <div class="nav-buttons">
            <button type="button" id="prev-btn">← Previous</button>
            <button type="button" id="next-btn">Next →</button>
        </div>
        <div class="indicator" id="step-indicator">Step 1 of 7</div>
    </div>

    <script>
        const steps = [
            {
                title: "Step 1: Open Google AI Studio",
                text: "First, open the Google AI Studio dashboard. Click the green button below to open it in a new tab, then come back to this page for the next step.",
                buttonLink: "https://aistudio.google.com/app/apikey",
                buttonText: "Open Google AI Studio"
            },
            {
                title: "Step 2: Create a Project",
                text: "Create a new project named <b>'Reading Helper'</b>. In Google AI Studio, the Generative Language API is enabled automatically when you create a free API key."
            },
            {
                title: "Step 3: Generate Your Key",
                text: "Click <b>'Get API key'</b> in the left sidebar, then click <b>'Create API key'</b> and select your <b>'Reading Helper'</b> project."
            },
            {
                title: "Step 4: Keep it Secret",
                text: "Your API key is like a password. Never share it publicly, post it online, or enter it on a public shared computer.",
                isWarning: true
            },
            {
                title: "Step 5: Stay on the Unbilled Free Tier",
                text: "To guarantee you are <b>never charged</b>, simply leave your AI Studio project on the <b>Free Tier</b> and do <b>not</b> attach a Google Cloud billing account. (Note: Google Cloud Billing 'Budgets' only send email alerts—they do not automatically block charges once billing is enabled!)",
                isWarning: true
            },
            {
                title: "Step 6: Copy and Paste",
                text: "Go back to the AI Studio tab, click the <b>'Copy'</b> button next to your key, then return to Reading Helper. Open the Menu (☰) and paste it into the API Key box."
            },
            {
                title: "All Done!",
                text: "Click <b>'Verify API Key'</b> in the Menu (☰) to confirm you see a green checkmark (✅). You're ready to illustrate stories!"
            }
        ];

        let currentStep = 0;
        const container = document.getElementById('step-container');
        const indicator = document.getElementById('step-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateUI() {
            const step = steps[currentStep];
            let html = `
                <h3>${step.title}</h3>
                <p>${step.text}</p>
            `;

            if (step.isWarning) {
                html = `
                    <div class="step-warning">
                        <span class="warning-icon">⚠️</span>
                        ${html}
                    </div>
                `;
            }

            container.innerHTML = `
                ${html}
                ${step.buttonLink ? `
                    <a href="${step.buttonLink}" target="_blank" rel="noopener" class="action-button">
                        ${step.buttonText}
                    </a>` : ''}
            `;
            indicator.textContent = `Step ${currentStep + 1} of ${steps.length}`;
            prevBtn.disabled = currentStep === 0;
            nextBtn.textContent = currentStep === steps.length - 1 ? "Finish" : "Next →";
        }

        nextBtn.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateUI();
            } else {
                window.close();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        updateUI();
    </script>
</body>
</html>
